
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14653d">
  <meta name="description" content="Aplikasi pengelolaan halaqah dan setoran Al-Quran">
  <title>HalaqahKu</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8f5ee;
    }
    header {
      background: #14653d;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px #0002;
    }
    header img { width: 42px; height: 42px; }
    header strong { font-size: 19px; }
    header small { display: block; opacity: .85; margin-top: 3px; }
    main {
      height: calc(100dvh - 66px);
      padding: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }
    #install {
      display: none;
      margin: 10px 16px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #c9932f;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <img src="./icon.svg" alt="Logo HalaqahKu">
    <div>
      <strong>HALAQAHKU</strong>
      <small>Aplikasi Monitoring Setoran Al-Qur'an</small>
    </div>
  </header>

  <button id="install">Pasang Aplikasi</button>

  <main>
    <iframe
      src="https://script.google.com/macros/s/AKfycby7KpoeL40QhP9T9jD4wljooSXXdj8RR0R3UAj72ZS6MovZ02CaAlB6c4BlFHXBFrCd/exec"
      title="Aplikasi HalaqahKu"
      allow="clipboard-read; clipboard-write">
    </iframe>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Service Worker:", error));
      });
    }

    let installPrompt;

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      installPrompt = event;
      document.getElementById("install").style.display = "block";
    });

    document.getElementById("install").addEventListener("click", async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      document.getElementById("install").style.display = "none";
    });
  </script>
</body>
</html>
